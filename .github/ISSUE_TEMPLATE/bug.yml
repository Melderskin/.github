name: Bug
description: Something in this repo is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste passwords, tokens, connection strings or personal data, not even from a log. If it is a security problem, add the label **security** and keep the details short.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: OS, browser or device, and the version, branch or commit.
      placeholder: "Windows 11, Edge, main at abc1234"
  - type: input
    id: jira
    attributes:
      label: Jira item
      description: The MEL key if this blocks one, or "none".
      placeholder: none

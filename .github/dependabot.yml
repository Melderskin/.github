# Keeps the actions used by the shared workflows up to date (security fixes first).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-all:
        patterns: ["*"]
  # html-validate for site-check.yml. After an update, run node .github/site-check/embed.js in the pull request
  # (the Site check tools workflow fails until the copies in site-check.yml match).
  - package-ecosystem: npm
    directory: /.github/site-check
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site-check-tools:
        patterns: ["*"]

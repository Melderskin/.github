# Stops secrets (passwords, keys, tokens) from reaching a repo: gitleaks over the whole history. The free stand-in for
# GitHub's paid secret scanning. The pre-commit hook in each clone (templates/<kind>/.githooks/) catches them earlier;
# this catches clones where the hook is off. A .gitleaks.toml at the root of the calling repo is used if it exists.
#
# Called from a small workflow in each repo, for example .github/workflows/secrets.yml:
#
#   name: Secrets
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     gitleaks:
#       uses: Melderskin/.github/.github/workflows/secrets.yml@<commit-sha> # main yyyy-mm-dd
#
# Callers pin this workflow to a full commit SHA, not @main, so a change here cannot change what runs in their repo
# without a pull request there; Dependabot (github-actions) keeps the pin fresh.
name: Secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so a secret that was committed and removed is still found
          persist-credentials: false
      - name: Secrets in the history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --no-banner --redact

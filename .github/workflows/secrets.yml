# Stops secrets (passwords, keys, tokens) from reaching a repo: gitleaks over the whole history. The free stand-in for
# GitHub's paid secret scanning. The pre-commit hook in each clone (templates/<kind>/.githooks/) catches them earlier;
# this catches clones where the hook is off.
#
# The gitleaks settings (.gitleaks.toml and .gitleaksignore at the root of the calling repo) are always read from the
# base branch of a pull request, or the default branch otherwise, never from the commit being checked: a pull request
# cannot allow its own secret. A change to those files takes effect once it is merged. Without them, gitleaks uses its
# default rules.
#
# Called from a small workflow in each repo, for example .github/workflows/secrets.yml:
#
#   name: Secrets
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     gitleaks:
#       uses: Melderskin/.github/.github/workflows/secrets.yml@<commit-sha> # main yyyy-mm-dd
#
# Callers pin this workflow to a full commit SHA, not @main, so a change here cannot change what runs in their repo
# without a pull request there; Dependabot (github-actions) keeps the pin fresh.
name: Secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: The commit to check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0   # the whole history, so a secret that was committed and removed is still found
          persist-credentials: false

      - name: The gitleaks settings from the base or default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          sparse-checkout: |
            .gitleaks.toml
            .gitleaksignore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Secrets in the history (gitleaks)
        run: |
          # gitleaks reads .gitleaks.toml and .gitleaksignore from the folder it scans; the scan reads the git history,
          # not the working tree, so drop the checked commit's copies and pass the trusted ones explicitly.
          rm -f repo/.gitleaks.toml repo/.gitleaksignore
          mkdir -p "$RUNNER_TEMP/gitleaks"
          if [ -f trusted/.gitleaks.toml ]; then
            cp trusted/.gitleaks.toml "$RUNNER_TEMP/gitleaks/config.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks/config.toml"
          fi
          if [ -f trusted/.gitleaksignore ]; then
            cp trusted/.gitleaksignore "$RUNNER_TEMP/gitleaks/.gitleaksignore"
          else
            : > "$RUNNER_TEMP/gitleaks/.gitleaksignore"
          fi
          mkdir -p "$RUNNER_TEMP/gitleaks-out"
          commits=$(git -C repo rev-list --count HEAD)

          # gitleaks can log a git error ("stderr is not empty"), scan nothing and still exit 0, so the job checks
          # what it actually did: no error lines, a report written, and more than 0 commits scanned. safe.directory
          # (command scope, which git trusts) keeps a different owner of the mounted folder from stopping git.
          set +e
          docker run --rm -v "$PWD/repo:/repo" -v "$RUNNER_TEMP/gitleaks:/settings:ro" -v "$RUNNER_TEMP/gitleaks-out:/out" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --no-banner --no-color --redact \
            --config /settings/config.toml --gitleaks-ignore-path /settings/.gitleaksignore \
            --report-format json --report-path /out/report.json 2>&1 | tee "$RUNNER_TEMP/gitleaks-out/log.txt"
          status=${PIPESTATUS[0]}
          set -e

          log="$RUNNER_TEMP/gitleaks-out/log.txt"
          scanned=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -Eo '[0-9]+ commits scanned' | grep -Eo '^[0-9]+' | tail -n 1)
          if sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)'; then
            echo "::error::gitleaks reported an error, so the history was not checked. See the log above."
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "::error::gitleaks found secrets. Remove them, rotate any that were real, and see .githooks/README.md."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks stopped with exit code $status, so the history was not checked."
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/gitleaks-out/report.json" ]; then
            echo "::error::gitleaks wrote no report, so the history was not checked."
            exit 1
          fi
          if [ "$commits" -gt 0 ] && { [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; }; then
            echo "::error::gitleaks scanned 0 of $commits commits, so the history was not checked."
            exit 1
          fi
          echo "gitleaks checked $scanned commits ($commits on the checked branch): no secrets."

# The files that every kind shares (git hooks, .gitattributes, LICENSE, CODEOWNERS) must stay the same in every
# templates/<kind>/ folder, so a fix in one kind is not forgotten in the others.
name: Templates check

on:
  pull_request:
    paths: ["templates/**", ".github/workflows/templates-check.yml"]
  push:
    branches: [main]
    paths: ["templates/**", ".github/workflows/templates-check.yml"]

permissions:
  contents: read

jobs:
  same:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared files are the same in every kind
        run: |
          status=0
          for f in .gitattributes LICENSE .github/CODEOWNERS .githooks/pre-commit .githooks/install.sh .githooks/install.ps1 .githooks/README.md check.ps1 build.sh test.sh serve.sh check.sh; do
            for kind in site expo docs; do
              if ! cmp -s "templates/dotnet/$f" "templates/$kind/$f"; then
                echo "::error file=templates/$kind/$f::differs from templates/dotnet/$f"
                status=1
              fi
            done
          done
          for kind in dotnet site expo docs; do
            for f in CLAUDE.md .editorconfig build.ps1 test.ps1 serve.ps1; do
              [ -f "templates/$kind/$f" ] || { echo "::error::templates/$kind/$f is missing"; status=1; }
            done
          done
          exit $status
      - name: The settings files are what make-settings.js writes
        if: always()
        run: |
          node templates/claude/make-settings.js
          if ! git diff --exit-code -- templates/claude; then
            echo "::error::run node templates/claude/make-settings.js and commit the settings files"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- templates/claude)" ]; then
            git status --porcelain -- templates/claude
            echo "::error::make-settings.js writes a settings file that is not committed"
            exit 1
          fi
      - name: The guard's tests pass
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File templates/claude/hooks/guard.tests.ps1
